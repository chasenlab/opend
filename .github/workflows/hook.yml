name: Create Tag

on:
  workflow_dispatch:

  pull_request:
    types:
      - closed

jobs:
  hook:
    name: 'Create Tag'
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'topic/detect/release-') &&
      github.event.pull_request.base.ref == 'master'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # get version from pull request title
      - id: parse
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          Version="${PR_TITLE##* }"
          if [[ ! "$Version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$PR_TITLE" != "(≧ω≦): upgrade OpenD version to ${Version}" ]]; then
            echo "Invalid automated release PR title: $PR_TITLE"
            exit 1
          fi
          echo "version=${Version}"
          echo "version=${Version}" >> "$GITHUB_OUTPUT"

      - name: Create Tag
        if: ${{ steps.parse.outputs.version != '' }}
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Upgrade to v${VERSION}"

      - name: Push changes
        uses: ad-m/github-push-action@master
        if: ${{ steps.parse.outputs.version != '' }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }} # because github disable GITHUB_TOKEN push event
          push_only_tags: true
          force: true
          tags: true
